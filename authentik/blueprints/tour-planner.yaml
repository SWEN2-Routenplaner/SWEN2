version: 1
metadata:
  name: "Tour Planner Backend"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: tourplanner-provider
    identifiers:
      name: "Tour Planner Provider"
    attrs:
      client_id: "tour-planner"
      client_secret: "testsecret"
      client_type: "confidential"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      redirect_uris: |
        http://localhost:8080/login/oauth2/code/authentik
        http://127.0.0.1:8080/login/oauth2/code/authentik
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      access_token_validity: "hours=1"
      refresh_token_validity: "days=30"
      sub_mode: "hashed_user_id"

  - model: authentik_core.application
    id: tourplanner-app
    identifiers:
      slug: "tour-planner"
    attrs:
      name: "Tour Planner"
      provider: !KeyOf tourplanner-provider
      policy_engine_mode: "any"

  - identifiers:
      slug: default-enrollment-flow
    model: authentik_flows.flow
    id: default-enrollment-flow
    attrs:
      name: Default enrollment Flow
      title: Welcome to authentik!
      designation: enrollment
      authentication: require_unauthenticated

  - id: default-enrollment-field-username
    model: authentik_stages_prompt.prompt
    identifiers:
      name: default-enrollment-field-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0

  - id: default-enrollment-field-password
    model: authentik_stages_prompt.prompt
    identifiers:
      name: default-enrollment-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 1

  - id: default-enrollment-field-password-repeat
    model: authentik_stages_prompt.prompt
    identifiers:
      name: default-enrollment-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 2

  - id: default-enrollment-field-name
    model: authentik_stages_prompt.prompt
    identifiers:
      name: default-enrollment-field-name
    attrs:
      field_key: name
      label: Name
      type: text
      required: true
      placeholder: Name
      placeholder_expression: false
      order: 3

  - id: default-enrollment-field-email
    model: authentik_stages_prompt.prompt
    identifiers:
      name: default-enrollment-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 4

  - id: default-enrollment-prompt
    model: authentik_stages_prompt.promptstage
    identifiers:
      name: default-enrollment-prompt
    attrs:
      fields:
        - !KeyOf default-enrollment-field-username
        - !KeyOf default-enrollment-field-password
        - !KeyOf default-enrollment-field-password-repeat
        - !KeyOf default-enrollment-field-name
        - !KeyOf default-enrollment-field-email

  - id: default-enrollment-user-write
    model: authentik_stages_user_write.userwritestage
    identifiers:
      name: default-enrollment-user-write
    attrs:
      user_creation_mode: always_create

  - id: default-enrollment-user-login
    model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-enrollment-user-login

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf default-enrollment-flow
      stage: !KeyOf default-enrollment-prompt
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf default-enrollment-flow
      stage: !KeyOf default-enrollment-user-write
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf default-enrollment-flow
      stage: !KeyOf default-enrollment-user-login
      order: 100
  - model: authentik_stages_identification.identificationstage
    id: default-authentication-identification
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-enrollment-flow]]
